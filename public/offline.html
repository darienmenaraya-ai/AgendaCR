<!doctype html>
<html lang="es-CR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#163e35" />
    <title>Sin conexión | AgendaCR</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f7f8f5;
        color: #172b27;
        font-family: Arial, Helvetica, sans-serif;
      }
      main {
        width: min(100%, 440px);
        border: 1px solid #e2eae4;
        border-radius: 24px;
        background: #fff;
        padding: 32px;
        text-align: center;
        box-shadow: 0 16px 48px rgb(23 43 39 / 8%);
      }
      img {
        width: 64px;
        height: 64px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 24px;
      }
      p {
        margin: 0;
        color: #71817c;
        line-height: 1.65;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" width="64" height="64" />
      <h1>Estás sin conexión</h1>
      <p>
        Conéctate a internet y vuelve a intentarlo. Tus citas y datos no se
        guardan sin conexión.
      </p>
    </main>
  </body>
</html>
